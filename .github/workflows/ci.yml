name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Check formatting
        run: ./mvnw --batch-mode spotless:check

      - name: Unit + integration tests (Testcontainers)
        run: ./mvnw --batch-mode verify

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: app/target/site/jacoco/
          if-no-files-found: ignore

  image:
    name: Build container image
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build image with Cloud Native Buildpacks
        run: ./mvnw --batch-mode -pl app spring-boot:build-image -DskipTests

      # Registry push is stubbed until DigitalOcean Container Registry credentials exist.
